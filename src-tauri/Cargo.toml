[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Desktop shell for DeepSeek Harness (dsh web)"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_Graphics_Dwm", "Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
# keep the binary lean; DBus deps etc. are not needed on Windows
strip = true
