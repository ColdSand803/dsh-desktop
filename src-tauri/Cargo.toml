[package]
name = "dsh-desktop"
version = "0.1.2"
description = "Desktop shell for DeepSeek Harness (dsh web)"
edition = "2021"
license = "MIT"
authors = ["ColdSand803"]
repository = "https://github.com/ColdSand803/dsh-desktop"
homepage = "https://github.com/ColdSand803/dsh-desktop"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `unstable`: multi-webview (Window::add_child / WebviewBuilder). The dsh GUI has
# to be its own *top-level* browsing context, not an iframe -- since 0.1.5 dsh
# authenticates the browser with a `SameSite=Strict` cookie, which no browser
# will ever send from a cross-site frame. See `mount_gui` in src/main.rs.
tauri = { version = "2", features = ["tray-icon", "image-png", "unstable"] }
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Graphics_Dwm",
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    # Job object: reap the `dsh web` tree even if we die abnormally.
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
# keep the binary lean; DBus deps etc. are not needed on Windows
strip = true
