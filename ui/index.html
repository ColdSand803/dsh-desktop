<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>DSH Desktop</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0f1115;
        color: #e2e8f0;
      }
      .boot {
        text-align: center;
      }
      .logo {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #3c6eff, #1e3a8a);
        display: flex;
        align-items: center;
        justify-content: center;
        font-weight: 700;
        font-size: 26px;
        color: #fff;
        animation: pulse 1.6s ease-in-out infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          transform: scale(1);
          opacity: 1;
        }
        50% {
          transform: scale(0.96);
          opacity: 0.75;
        }
      }
      .text {
        font-size: 15px;
        color: #94a3b8;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="boot">
      <div class="logo">dsh</div>
      <div class="text">正在启动 DeepSeek Harness…</div>
    </div>
  </body>
</html>
