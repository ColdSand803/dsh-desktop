name: Release

# Tag-driven: `git tag v0.1.0 && git push --tags` builds, signs and publishes.
# The tag version must match `version` in tauri.conf.json, otherwise the updater
# will not consider the release newer than what users already have.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    permissions:
      # Required to create the release and upload the installer + latest.json.
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs the updater artifacts. Without these the build still produces
          # an installer, but no valid signature -- and the updater refuses
          # unsigned updates, so existing installs would ignore the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: DSH Desktop ${{ github.ref_name }}
          releaseDraft: true
          prerelease: false
          # createUpdaterArtifacts is on in tauri.conf.json, so this also emits
          # and uploads latest.json -- the file the updater endpoint fetches.
          args: ""
